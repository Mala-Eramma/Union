<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Union Bank</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>UNION BANK</h1>
        <p>Account Management System</p>
    </header>

    <main>

        <h2>Welcome, <span id="username"></span></h2>

        <h3>Account Management</h3>

        <div>
            <a href="create_account.html">Create Account</a>
            <br><br>

            <a href="deposit.html">Deposit</a>
            <br><br>

            <a href="withdrawal.html">Withdrawal</a>
            <br><br>

            <a href="balance.html">Current Balance</a>
            <br><br>

            <a href="details.html">Account Holder Details</a>
            <br><br>

            <button onclick="logout()">Logout</button>
        </div>

    </main>

    <script>
        const currentUser = localStorage.getItem("currentUser");

        if (!currentUser) {
            window.location.href = "login.html";
        }

        document.getElementById("username").textContent = currentUser;

        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
