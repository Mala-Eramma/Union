<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Holder Details - Union Bank</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>UNION BANK</h1>
        <p>Account Management System</p>
    </header>

    <main>

        <h2>Account Holder Details</h2>

        <div id="result"></div>

        <p>
            <a href="home.html">Back to Home</a>
        </p>

    </main>

    <script>
        const currentUser = localStorage.getItem("currentUser");

        if (!currentUser) {
            window.location.href = "login.html";
        }

        const accounts =
            JSON.parse(localStorage.getItem("accounts")) || [];

        const account = accounts.find(function(account) {
            return account.username === currentUser;
        });

        const result = document.getElementById("result");

        if (!account) {

            result.innerHTML =
                "<p>Bank account not found. Please create an account first.</p>";

        } else {

            result.innerHTML =
                "<h3>Account Details</h3>" +
                "<p>Username: " + account.username + "</p>" +
                "<p>Phone: " + account.phone + "</p>" +
                "<p>Aadhar: " + account.aadhar + "</p>" +
                "<p>Account Number: " + account.accountNumber + "</p>" +
                "<p>Balance: ₹" + Number(account.balance).toFixed(2) + "</p>";
        }
    </script>

</body>
</html>
